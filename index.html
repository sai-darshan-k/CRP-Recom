        const npkThresholds = {
            nitrogen: { min: 20, max: 250 },
            phosphorus: { min: 20, max: 100 },
            potassium: { min: 15, max: 200 }
        };

        const monthToSeason = {
            "January": "Rabi",
            "February": "Rabi",
            "March": "Zaid",
            "April": "Zaid",
            "May": "Zaid",
            "June": "Kharif",
            "July": "Kharif",
            "August": "Kharif",
            "September": "Kharif",
            "October": "Rabi",
            "November": "Rabi",
            "December": "Rabi"

        function calculateNPKDistance(crop, inputN, inputP, inputK) {
            // Normalize differences to avoid bias from different scales
            const nDiff = (crop.npk.N - inputN) / (npkThresholds.nitrogen.max - npkThresholds.nitrogen.min);
            const pDiff = (crop.npk.P - inputP) / (npkThresholds.phosphorus.max - npkThresholds.phosphorus.min);
            const kDiff = (crop.npk.K - inputK) / (npkThresholds.potassium.max - npkThresholds.potassium.min);
            return Math.sqrt(nDiff * nDiff + pDiff * pDiff + kDiff * kDiff);
        }

        function checkNPKAlerts(nitrogen, phosphorus, potassium) {
            const alerts = [];
            if (nitrogen && nitrogen < npkThresholds.nitrogen.min) {
                alerts.push(`Warning: Nitrogen value (${nitrogen} kg/ha) is lower than typical minimum (${npkThresholds.nitrogen.min} kg/ha). Consider increasing to improve yield.`);
            } else if (nitrogen && nitrogen > npkThresholds.nitrogen.max) {
                alerts.push(`Warning: Nitrogen value (${nitrogen} kg/ha) is higher than typical maximum (${npkThresholds.nitrogen.max} kg/ha). Risk of over-fertilization.`);
            }
            if (phosphorus && phosphorus < npkThresholds.phosphorus.min) {
                alerts.push(`Warning: Phosphorus value (${phosphorus} kg/ha) is lower than typical minimum (${npkThresholds.phosphorus.min} kg/ha). Consider increasing for root development.`);
            } else if (phosphorus && phosphorus > npkThresholds.phosphorus.max) {
                alerts.push(`Warning: Phosphorus value (${phosphorus} kg/ha) is higher than typical maximum (${npkThresholds.phosphorus.max} kg/ha). Risk of nutrient imbalance.`);
            }
            if (potassium && potassium < npkThresholds.potassium.min) {
                alerts.push(`Warning: Potassium value (${potassium} kg/ha) is lower than typical minimum (${npkThresholds.potassium.min} kg/ha). Consider increasing for plant health.`);
            } else if (potassium && potassium > npkThresholds.potassium.max) {
                alerts.push(`Warning: Potassium value (${potassium} kg/ha) is higher than typical maximum (${npkThresholds.potassium.max} kg/ha). Risk of soil issues.`);
            }
            return alerts;
        }

        function renderTable(data, bestCrop) {
            const tableBody = document.getElementById("cropTableBody");
            tableBody.innerHTML = "";
            if (data.length === 0) {
                const row = document.createElement("tr");
                row.innerHTML = `<td colspan="9" class="p-3 text-center text-gray-500">No crops match the criteria. Try broadening your filters (e.g., select 'All Months' or 'All Crop Types').</td>`;
                tableBody.appendChild(row);
                return;
            }
            data.forEach(item => {
                const isBest = bestCrop && item.crop === bestCrop.crop;
                const row = document.createElement("tr");
                row.className = isBest ? "bg-green-100" : "";
                row.innerHTML = `
                    <td class="p-3 border-b">${item.crop}</td>
                    <td class="p-3 border-b">${item.cropType}</td>
                    <td class="p-3 border-b">${item.season}</td>
                    <td class="p-3 border-b">${item.months.join(", ")}</td>
                    <td class="p-3 border-b">${item.soil.join(", ")}</td>
                    <td class="p-3 border-b">${item.districts.join(", ")}</td>
                    <td class="p-3 border-b">${item.npkString}</td>
                    <td class="p-3 border-b">${item.remarks}</td>
                    <td class="p-3 border-b">${isBest ? "Best Suited" : ""}</td>
                `;
                tableBody.appendChild(row);
            });
        }

        function renderAlerts(alerts) {
            const alertsDiv = document.getElementById("alerts");
            alertsDiv.innerHTML = "";
            if (alerts.length > 0) {
                const alertBox = document.createElement("div");
                alertBox.className = "bg-yellow-100 border-l-4 border-yellow-500 text-yellow-700 p-4 rounded";
                alertBox.innerHTML = alerts.map(alert => `<p>${alert}</p>`).join("");
                alertsDiv.appendChild(alertBox);
            }
        }

        function filterTable() {
            const month = document.getElementById("month").value;
            const season = document.getElementById("season").value;
            const soil = document.getElementById("soil").value;
            const district = document.getElementById("district").value;
            const cropType = document.getElementById("cropType").value;
            const nitrogen = parseFloat(document.getElementById("nitrogen").value) || 0;
            const phosphorus = parseFloat(document.getElementById("phosphorus").value) || 0;
            const potassium = parseFloat(document.getElementById("potassium").value) || 0;

            // Check NPK thresholds and display alerts
            let alerts = checkNPKAlerts(nitrogen, phosphorus, potassium);

            // Filter crops based on month, season, soil, district, and crop type
            let filteredData = cropData.filter(item => {
                const monthMatch = month === "" || item.months.includes(month);
                const seasonMatch = season === "" || item.season === season || (month && monthToSeason[month] === item.season);
                const soilMatch = soil === "" || item.soil.includes(soil);
                const districtMatch = district === "" || item.districts.includes(district);
                const cropTypeMatch = cropType === "" || item.cropType === cropType;
                return monthMatch && seasonMatch && soilMatch && districtMatch && cropTypeMatch;
            });

            // If no crops match, relax month and season constraints
            if (filteredData.length === 0) {
                filteredData = cropData.filter(item => {
                    const soilMatch = soil === "" || item.soil.includes(soil);
                    const districtMatch = district === "" || item.districts.includes(district);
                    const cropTypeMatch = cropType === "" || item.cropType === cropType;
                    return soilMatch && districtMatch && cropTypeMatch;
                });
                if (filteredData.length > 0) {
                    alerts.push("No crops match the selected month/season. Showing alternatives suitable for the district and soil.");
                }
            }

            // Sort by NPK proximity and weight
            filteredData = filteredData.map(item => ({
                ...item,
                distance: calculateNPKDistance(item, nitrogen || 100, phosphorus || 50, potassium || 40)
            })).sort((a, b) => {
                const scoreA = a.distance - a.weight * 0.5; // Adjust weight impact
                const scoreB = b.distance - b.weight * 0.5;
                return scoreA - scoreB;
            });

            // Select the best-suited crop (top of sorted list)
            const bestCrop = filteredData.length > 0 ? filteredData[0] : null;

            renderAlerts(alerts);
            renderTable(filteredData, bestCrop);
        }

        // Add event listeners to all inputs
        document.querySelectorAll("select, input").forEach(element => {
            element.addEventListener("input", filterTable);
        });

        // Initial render
        filterTable();
    </script>
</body>
</html>
